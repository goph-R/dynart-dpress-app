; dpress site configuration
;
; The presence of this file marks the root of a site: the `dpress` command walks up from the
; working directory looking for it, so the command works from anywhere inside the project.

app.root_path   = "C:/xampp/htdocs/dynart-dpress-app"
app.error_pages_folder = "~/errors"
app.base_url    = "http://localhost/dynart-dpress-app/public"
app.environment = dev

; The DSN has to be quoted, a bare = breaks parse_ini_file with INI_SCANNER_TYPED
database.default.dsn          = "mysql:host=localhost"
database.default.name         = dpress_dev
database.default.username     = root
database.default.password     =
database.default.table_prefix = dp_

; A site serves one language, see the plan. Add more only for a translated admin.
translation.all     = en
translation.default = en

logger.path  = "~/logs"
logger.level = debug

; at least 32 characters, HS256 refuses anything shorter
jwt.secret = "dev-secret-change-me-0123456789abcdef"
jwt.cookie_name = dpress_token

; the front controller rewrites, so URLs have no index.php in them
router.use_rewrite = true

dpress.site_name         = "dpress dev"
dpress.registration_open = true
dpress.default_roles     = reader

mail.mailer     = log
mail.from_email = "no-reply@dpress.local"
mail.from_name  = "dpress dev"
