title       = "Plain"
description = "A minimal example theme. Two layouts - a wide front page and a reading column with a sidebar - one stylesheet in assets/, and the places each layout renders."
author      = "dpress"
version     = "2.0.0"

; The places this theme renders. The menu editor and the block editor both offer these.
;
; Which layout renders which is the theme's own business and the editors do not ask: `sidebar` is
; drawn by `layout.phtml` and `home_top` by `layout-home.phtml`, so a block put in one appears
; beside a post and a block put in the other appears only on the front page.
places[] = main
places[] = sidebar
places[] = home_top
places[] = footer
